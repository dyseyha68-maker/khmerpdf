services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --timeout 1200 --workers 3 --threads 2 --graceful-timeout 30"
    volumes:
      - .:/app
      - data_volume:/data
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATA_DIR=/data
      - CELERY_ALWAYS_EAGER=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  # General PDF tools (compress, merge, split, protect, organize, images)
  celery:
    build: .
    image: khmerpdf-celery
    restart: unless-stopped
    command: celery -A config worker -Q celery --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - data_volume:/data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATA_DIR=/data
      - CELERY_ALWAYS_EAGER=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  # OCR only: one process so Netra is loaded once (memory), warmed at start-up
  celery-ocr:
    build: .
    image: khmerpdf-celery
    restart: unless-stopped
    command: celery -A config worker -Q ocr --loglevel=info --concurrency=1 --hostname=ocr@%h
    volumes:
      - .:/app
      - data_volume:/data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATA_DIR=/data
      - CELERY_ALWAYS_EAGER=False
      - WARM_NETRA=1
      - HF_HOME=/data/hf_cache
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data:
  data_volume:
