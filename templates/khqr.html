    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Khmer PDF Tools</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }
        
        [data-theme="dark"] {
            --primary: #e0e0e0;
            --primary-dark: #ffffff;
            --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #333333;
        }
        
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s;
        }
        
        .container {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: background 0.3s;
        }
        
        .success-icon { font-size: 72px; margin-bottom: 20px; }
        
        .thank-you-text { 
            font-size: 26px; 
            color: var(--text); 
            margin-bottom: 8px; 
            font-weight: 700;
        }
        
        .sub-text { 
            color: var(--text-secondary); 
            font-size: 15px; 
            margin-bottom: 24px;
        }
        
        .qr-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        .qr-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        
        .qr-image {
            width: 200px;
            height: 240px;
            margin-bottom: 12px;
        }
        
        .amount-btns {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        .amount-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .amount-btn:hover { transform: scale(1.05); }
        
        .donate-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        
        .download-btn {
            display: block;
            background: var(--primary);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .download-btn:hover { transform: translateY(-2px); }
        
        .home-btn {
            display: inline-block;
            background: var(--surface);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border);
        }
        .home-btn:hover { background: var(--surface); }
        
        .text-en, .text-kh { display: none; }
        body.lang-en .text-en { display: block; }
        body.lang-kh .text-kh { display: block; }
        
        @media (max-width: 480px) {
            .container { padding: 20px 15px; }
            .amount-btn { padding: 8px 12px; font-size: 14px; }
            .qr-section { padding: 12px; }
            .qr-image { width: 160px; height: 190px; }
            .download-btn { padding: 12px 20px; font-size: 14px; }
            .home-btn { padding: 10px 16px; font-size: 13px; }
            .success-icon { font-size: 48px; }
            .thank-you-text { font-size: 20px; }
        }
        
        @media (max-width: 350px) {
            .container { padding: 15px 10px; }
            .qr-image { width: 140px; height: 170px; }
            .amount-btns { gap: 4px; }
            .amount-btn { padding: 6px 10px; font-size: 12px; }
        }
    </style>
    <script>
        function setLang(lang) {
            document.body.className = 'lang-' + lang;
            localStorage.setItem('pdf_lang', lang);
        }
        const savedLang = localStorage.getItem('pdf_lang') || 'kh';
        setLang(savedLang);
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('pdf_theme', theme);
        }
        const savedTheme = localStorage.getItem('pdf_theme') || 'light';
        setTheme(savedTheme);
    </script>
</head>
<body class="lang-kh">
    <div class="container">
        <div class="success-icon">✅</div>
        <h1 class="thank-you-text">
            <span class="text-en">Thank You!</span>
            <span class="text-kh">អរគុណ!</span>
        </h1>
        <p class="sub-text">
            <span class="text-en">Your file has been processed successfully.</span>
            <span class="text-kh">ឯកសាររបស់អ្នកត្រូវបានដំណើរការដោយជោគជ័យ។</span>
        </p>
        
        <div class="qr-section">
            <div class="qr-title">
                <span class="text-en">Support Us with QR Code</span>
                <span class="text-kh">គេហទំព័ររបស់យើងជាមួយ QR Code</span>
            </div>
{% load static %}
            <img src="{% static 'khqr.jpg' %}" alt="QR Code" class="qr-image">
            <div class="amount-btns">
                <button class="amount-btn">$0.5</button>
                <button class="amount-btn">$1</button>
                <button class="amount-btn">$2</button>
                <button class="amount-btn">$5</button>
                <button class="amount-btn">$10</button>
            </div>
            <p class="donate-text">
                <span class="text-en">Any donation is appreciated!</span>
                <span class="text-kh">ដើម្បីជាការលើកទឹកចិត្តបន្ត</span>
            </p>
        </div>
        
        <a href="{{ download_url }}" class="download-btn" download>
            <span class="text-en">Download File</span>
            <span class="text-kh">ទាញយកឯកសារ</span>
        </a>
        
        <a href="/" class="home-btn">
            <span class="text-en"> Back to Home</span>
            <span class="text-kh"> ត្រឡប់ទៅដើម</span>
        </a>
    </div>
</body>
</html>
